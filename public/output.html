<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scripture Captions Output</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --cap-size: 3.6vw;
    --scr-size: 2.7vw;
    --accent: #f2c14e; --cap-color:#ffffff; --cap-bg:rgba(0,0,0,.78); --cap-align:center; --cap-font:sans-serif;
    --lyric-size:4.2vw; --lyric-color:#ffffff; --lyric-bg:rgba(0,0,0,.82);
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    gap: 1.4vw; padding: 0 4vw 3.6vw;
    box-sizing: border-box;
  }
  body.top #stage { flex-direction: column-reverse; justify-content: flex-end; padding: 3.6vw 4vw 0; }

  /* ---- scripture card ---- */
  #scripture {
    background: rgba(9, 13, 24, 0.9);
    border-left: 0.5vw solid var(--accent);
    border-radius: 1vw;
    padding: 1.6vw 2.4vw 1.8vw;
    color: #fff;
    box-shadow: 0 0.6vw 2.4vw rgba(0,0,0,0.45);
    opacity: 0; transform: translateY(2vw);
    transition: opacity .45s ease, transform .45s ease;
    display: none;
    max-height: 50vh; overflow: hidden;
  }
  body.top #scripture { transform: translateY(-2vw); }
  #scripture.on { opacity: 1; transform: none; }
  #scripture .head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 2vw;
    margin-bottom: 0.7vw;
  }
  #scripture .ref {
    font-size: calc(var(--scr-size) * 0.82); font-weight: 700; letter-spacing: .04em;
    color: var(--accent); text-transform: uppercase;
  }
  #scripture .ver {
    font-size: calc(var(--scr-size) * 0.52); font-weight: 600; letter-spacing: .08em;
    color: rgba(255,255,255,.62); text-transform: uppercase; white-space: nowrap;
  }
  #scripture .body {
    font-size: var(--scr-size); line-height: 1.34; font-weight: 500;
    font-family: Georgia, "Times New Roman", serif;
  }
  #scripture .body sup {
    font-family: "Segoe UI", Arial, sans-serif; font-size: .52em; font-weight: 700;
    color: var(--accent); margin-right: .25em; vertical-align: .55em;
  }
  #scripture .more { font-size: calc(var(--scr-size) * .5); color: rgba(255,255,255,.55); margin-top: .5vw; display: none; }

  /* ---- captions ---- */
  #captionWrap {
    align-self: center; max-width: 100%;
    opacity: 0; transition: opacity .35s ease;
  }
  #captionWrap.on { opacity: 1; }
  #caption {
    background:var(--cap-bg);color:var(--cap-color);text-align:var(--cap-align);font-family:var(--cap-font);
    font-size:var(--cap-size);line-height:1.28;font-weight:600;
    padding: 0.8vw 2vw 1vw; border-radius: 0.9vw;
    text-shadow: 0 0.1vw 0.3vw rgba(0,0,0,.6);
    overflow: hidden;
    min-width: 12vw;
  }
  #caption .interim { opacity: .82; }
  #lyricsWrap{align-self:center;max-width:100%;width:100%;display:none;opacity:0;transition:opacity .3s}#lyricsWrap.on{display:block;opacity:1}#lyricsCard{margin:0 auto;max-width:92%;background:var(--lyric-bg);color:var(--lyric-color);border-radius:1vw;padding:1.2vw 2vw 1.4vw;text-align:center;box-shadow:0 .5vw 2vw rgba(0,0,0,.35)}#lyricTitle{font-size:calc(var(--lyric-size)*.42);opacity:.75;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.45em}#lyricLine{font-size:var(--lyric-size);line-height:1.35;font-weight:700;white-space:pre-wrap;text-shadow:0 .1vw .3vw rgba(0,0,0,.6)}body.overlay-off #stage{visibility:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="lyricsWrap"><div id="lyricsCard"><div id="lyricTitle"></div><div id="lyricLine"></div></div></div>
  <div id="captionWrap"><div id="caption"></div></div>
  <div id="scripture">
    <div class="head"><div class="ref" id="ref"></div><div class="ver" id="ver"></div></div>
    <div class="body" id="verseBody"></div>
    <div class="more" id="more">continues&hellip;</div>
  </div>
</div>

<script>
(function () {
  var settings = {
    captionsOn: true, captionLines: 2, captionSize: 3.6, scriptureSize: 2.7,
    captionClearAfter:6,hideAfter:25,position:'bottom',overlayOn:true,captionColor:'#ffffff',captionBackground:'#000000',captionBackgroundOpacity:.78,captionAlign:'center',captionFont:'sans-serif',lyricSize:4.2,lyricColor:'#ffffff',lyricBackground:'#000000',lyricBackgroundOpacity:.82,liveLyricsEnabled:true
  };
  var stageEl = document.getElementById('stage');
  var capWrap = document.getElementById('captionWrap');
  var capEl = document.getElementById('caption');
  var scrEl = document.getElementById('scripture');
  var refEl = document.getElementById('ref');
  var verEl = document.getElementById('ver');
  var bodyEl = document.getElementById('verseBody');
  var moreEl = document.getElementById('more');
  var lyricsWrap=document.getElementById('lyricsWrap'),lyricTitle=document.getElementById('lyricTitle'),lyricLine=document.getElementById('lyricLine');
  var clearTimer = null, hideTimer = null, hideDomTimer = null;

  function applySettings() {
    document.documentElement.style.setProperty('--cap-size', settings.captionSize + 'vw');
    document.documentElement.style.setProperty('--scr-size', settings.scriptureSize + 'vw');
    document.body.classList.toggle('top',settings.position==='top');document.body.classList.toggle('overlay-off',settings.overlayOn===false);
    document.documentElement.style.setProperty('--cap-color',settings.captionColor||'#ffffff');document.documentElement.style.setProperty('--cap-bg','rgba('+hexToRgb(settings.captionBackground||'#000000')+','+(settings.captionBackgroundOpacity==null?.78:settings.captionBackgroundOpacity)+')');document.documentElement.style.setProperty('--cap-align',settings.captionAlign||'center');document.documentElement.style.setProperty('--cap-font',settings.captionFont||'sans-serif');
    document.documentElement.style.setProperty('--lyric-size',(settings.lyricSize||4.2)+'vw');document.documentElement.style.setProperty('--lyric-color',settings.lyricColor||'#ffffff');document.documentElement.style.setProperty('--lyric-bg','rgba('+hexToRgb(settings.lyricBackground||'#000000')+','+(settings.lyricBackgroundOpacity==null?.82:settings.lyricBackgroundOpacity)+')');
    if(!settings.captionsOn)capWrap.classList.remove('on');if(!settings.liveLyricsEnabled||!settings.captionsOn)lyricsWrap.classList.remove('on');
  }

  function hexToRgb(hex){var h=String(hex||'#000000').replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))h='000000';return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16);}
  function showLyrics(s){if(!s||settings.overlayOn===false||!settings.captionsOn||!settings.liveLyricsEnabled){lyricsWrap.classList.remove('on');setTimeout(function(){if(!lyricsWrap.classList.contains('on'))lyricsWrap.style.display='none';},320);return;}lyricsWrap.style.display='block';lyricTitle.textContent=s.title+(s.author?' · '+s.author:'');lyricLine.textContent=(s.lines||[])[s.index]||'';requestAnimationFrame(function(){lyricsWrap.classList.add('on');});}
  /* ---------- captions ---------- */
  function lineCount(el) {
    var lh = parseFloat(getComputedStyle(el).lineHeight);
    var pt = parseFloat(getComputedStyle(el).paddingTop) + parseFloat(getComputedStyle(el).paddingBottom);
    return Math.round((el.scrollHeight - pt) / lh);
  }

  function showCaption(text, final) {
    if (!settings.overlayOn || !settings.captionsOn) return;
    text = (text || '').replace(/\s+/g, ' ').trim();
    clearTimeout(clearTimer);
    if (!text) { capWrap.classList.remove('on'); return; }
    capWrap.classList.add('on');
    var words = text.split(' ');
    capEl.textContent = text;
    var guard = 0;
    while (lineCount(capEl) > settings.captionLines && words.length > 1 && guard++ < 200) {
      words.shift();
      capEl.textContent = words.join(' ');
    }
    if (!final) capEl.classList.add('interim'); else capEl.classList.remove('interim');
    if (settings.captionClearAfter > 0) {
      clearTimer = setTimeout(function () { capWrap.classList.remove('on'); }, settings.captionClearAfter * 1000);
    }
  }

  /* ---------- scripture ---------- */
  function fitScripture() {
    // shrink the verse text until the card fits its max height
    var base = settings.scriptureSize;
    var size = base, guard = 0;
    document.documentElement.style.setProperty('--scr-size', size + 'vw');
    while (scrEl.scrollHeight > scrEl.clientHeight + 1 && size > base * 0.45 && guard++ < 30) {
      size *= 0.94;
      document.documentElement.style.setProperty('--scr-size', size + 'vw');
    }
  }

  function showScripture(s, remainingMs) {
    clearTimeout(hideTimer); clearTimeout(hideDomTimer);
    if (!s || settings.overlayOn === false) {
      scrEl.classList.remove('on');
      hideDomTimer = setTimeout(function () { scrEl.style.display = 'none'; }, 500);
      return;
    }
    refEl.textContent = s.label;
    verEl.textContent = s.version + (s.versionName ? ' · ' + s.versionName : '');
    bodyEl.innerHTML = '';
    var multi = s.verses.length > 1;
    s.verses.forEach(function (v, i) {
      if (multi) { var sup = document.createElement('sup'); sup.textContent = v.n; bodyEl.appendChild(sup); }
      bodyEl.appendChild(document.createTextNode(v.text + (i < s.verses.length - 1 ? ' ' : '')));
    });
    moreEl.style.display = s.partial ? 'block' : 'none';
    scrEl.style.display = 'block';
    document.documentElement.style.setProperty('--scr-size', settings.scriptureSize + 'vw');
    fitScripture();
    requestAnimationFrame(function () { requestAnimationFrame(function () { scrEl.classList.add('on'); }); });
    var ms = remainingMs != null ? remainingMs : settings.hideAfter * 1000;
    if (settings.hideAfter > 0 && ms > 0) {
      hideTimer = setTimeout(function () { showScripture(null); }, ms);
    }
  }

  /* ---------- connection ---------- */
  function connect() {
    var es = new EventSource('/events');
    es.addEventListener('hello', function (e) {
      var d = JSON.parse(e.data);
      Object.assign(settings, d.settings); applySettings();
      if (d.scripture) {
        var remain = settings.hideAfter > 0 ? (d.scripture.shownAt + settings.hideAfter * 1000 - Date.now()) : null;
        if (remain === null || remain > 0) showScripture(d.scripture, remain);
      } else showScripture(null);
      showLyrics(d.lyric || null);
    });
    es.addEventListener('caption', function (e) { var d = JSON.parse(e.data); showCaption(d.text, d.final); });
    es.addEventListener('lyrics',function(e){showLyrics(JSON.parse(e.data));});
    es.addEventListener('scripture', function (e) { showScripture(JSON.parse(e.data)); });
    es.addEventListener('settings', function (e) {
      Object.assign(settings, JSON.parse(e.data)); applySettings();
      if(scrEl.classList.contains('on'))fitScripture();if(settings.overlayOn===false){showScripture(null);showLyrics(null);capWrap.classList.remove('on');}
    });
    es.onerror = function () { /* browser retries automatically */ };
  }

  applySettings();
  connect();
})();
</script>
</body>
</html>
